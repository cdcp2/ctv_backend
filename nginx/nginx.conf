worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Opcional: podrías validar publish contra el backend con on_publish
            # on_publish http://backend:3000/api/admin/live-stream/auth;

            # Ejecuta ffmpeg para generar HLS por cada stream
            exec ffmpeg -i rtmp://localhost/live/$name
                -c:v copy -c:a aac -f hls
                -hls_time 4 -hls_list_size 6 -hls_flags delete_segments+program_date_time
                /var/hls/$name/index.m3u8;
        }
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Servir HLS
    server {
        listen 8080;
        server_name _;

        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control no-cache;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Access-Control-Allow-Origin *;
        }

        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
